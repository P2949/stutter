[package]
name = "stutter"
version = "0.1.0"
edition.workspace = true

license.workspace = true

[dependencies]
stutter-common = { path = "../stutter-common", features = ["user"] }
stutter-config = { path = "../stutter-config", features = ["cli"] }
stutter-core = { path = "../stutter-core" }
stutter-report = { path = "../stutter-report" }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
aya-log = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
inferno = { workspace = true }
thiserror = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }

toml = { workspace = true }
which = { workspace = true }

axum = { workspace = true }
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["server-auto", "tokio", "service", "http1", "http2"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
tower = { workspace = true }
url = { workspace = true }
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, features = ["client"], optional = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "time",
    "sync",
    "process",
    "io-util",
    "fs",
] }
regex = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
futures-util = { workspace = true }
 
[features]
default = []
# Deprecated no-op compatibility alias. The autotune controller is now
# unconditional; keep this only so old local build commands do not fail.
autotune-controller = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]
wayland-probe = [
    "dep:wayland-client",
    "dep:wayland-protocols",
]

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
# TODO(https://github.com/rust-lang/cargo/issues/12375): this should be an artifact dependency, but
# it's not possible to tell cargo to use `-Z build-std` to build it. We cargo-in-cargo in the build
# script to build this, but we want to teach cargo about the dependency so that cache invalidation
# works properly.
#
# Note also that https://github.com/rust-lang/cargo/issues/10593 occurs when `target = ...` is added
# to an artifact dependency; it seems possible to work around that by setting `resolver = "1"` in
# Cargo.toml in the workspace root.
#
# Finally note that *any* usage of `artifact = ...` in *any* Cargo.toml in the workspace breaks
# workflows with stable cargo; stable cargo outright refuses to load manifests that use unstable
# features.
stutter-ebpf = { path = "../stutter-ebpf" }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "stutter"
path = "src/main.rs"
