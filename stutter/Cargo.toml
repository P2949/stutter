[package]
name = "stutter"
version = "0.1.0"
edition.workspace = true

license.workspace = true

[dependencies]
stutter-common = { path = "../stutter-common", features = ["user"] }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
aya-log = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
libc = { workspace = true }
clap_complete = "4"
clap_mangen = "0.2"
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
inferno = "0.12"
thiserror = { workspace = true }
opentelemetry = { version = "0.24", optional = true }
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.17", features = ["grpc-tonic"], optional = true }

toml = { workspace = true }
which = { workspace = true }

axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "time",
    "sync",
    "process",
    "io-util",
    "fs",
] }
regex = { workspace = true }
ratatui = "0.30.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.32"
 
[features]
default = []
autotune-controller = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
# TODO(https://github.com/rust-lang/cargo/issues/12375): this should be an artifact dependency, but
# it's not possible to tell cargo to use `-Z build-std` to build it. We cargo-in-cargo in the build
# script to build this, but we want to teach cargo about the dependency so that cache invalidation
# works properly.
#
# Note also that https://github.com/rust-lang/cargo/issues/10593 occurs when `target = ...` is added
# to an artifact dependency; it seems possible to work around that by setting `resolver = "1"` in
# Cargo.toml in the workspace root.
#
# Finally note that *any* usage of `artifact = ...` in *any* Cargo.toml in the workspace breaks
# workflows with stable cargo; stable cargo outright refuses to load manifests that use unstable
# features.
stutter-ebpf = { path = "../stutter-ebpf" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "stutter"
path = "src/main.rs"
