name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly-2026-06-06

jobs:
  build:
    name: fmt build clippy test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust nightly with rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-06
          components: rust-src, rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install bpf-linker
        uses: ./.github/actions/setup-bpf-linker

      - name: Install dependency hygiene tools
        run: cargo install cargo-deny --locked

      - name: Enforce lint policy
        run: cargo run -p xtask -- no-allow-attrs

      - name: Run dependency hygiene
        run: cargo run -p xtask -- dependency-hygiene

      - name: Run full fmt/build/clippy/test gate
        run: scripts/smoke/build.sh

      - name: Objective behavioral contracts
        run: cargo test -p stutter --lib autotune::objective

      - name: Objective documentation contract
        run: cargo run -p xtask -- objective-docs --check

      - name: Capability tiers match verified evidence
        run: cargo run -p xtask -- capability-check

      - name: Run offline recommendation smoke
        run: scripts/smoke/offline_recommendation.sh

      - name: Run offline advisor smoke
        run: scripts/smoke/advisor_offline.sh

      - name: Validation campaign state machine
        run: cargo test -p xtask validation_campaign

      - name: Validation runner security
        run: cargo test -p stutter-validation-runner

      - name: Reboot simulation and kernel stage
        run: cargo test -p xtask validation_campaign::tests::kernels

      - name: Scenario and corpus generation
        run: cargo test -p xtask -- validation_campaign::tests::scenarios validation_campaign::tests::capture_exec validation_campaign::tests::corpus validation_campaign::tests::frame_score validation_campaign::tests::overhead_real validation_campaign::tests::workloads

      - name: Campaign integration, release policy and tagging
        run: cargo test -p xtask -- validation_campaign::tests::repo_pr validation_campaign::tests::integration validation_campaign::tests::policy validation_campaign::tests::policy_tasks validation_campaign::tests::release

      - name: Calibration roles and capability evidence kinds
        run: cargo test -p xtask -- diagnosis_calibration capability_check

  live-smoke:
    name: live smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust nightly with rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-06
          components: rust-src, rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install bpf-linker
        uses: ./.github/actions/setup-bpf-linker

      - name: Build first
        run: scripts/smoke/build.sh

      - name: Run sleep tree churn smoke
        run: sudo -E env RUSTUP_TOOLCHAIN=nightly-2026-06-06 RUST_LOG=info scripts/smoke/sleep_tree_churn.sh

      - name: Run minimal recording smoke
        run: sudo -E env RUSTUP_TOOLCHAIN=nightly-2026-06-06 RUST_LOG=info scripts/smoke/record_minimal.sh

  daemon-safety:
    name: daemon safety gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust nightly with rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-06
          components: rust-src, rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install bpf-linker
        uses: ./.github/actions/setup-bpf-linker

      - name: Run autotune safety matrix
        run: scripts/check-autotune-safety.sh

      - name: Startup recovery capability and identity contracts
        run: cargo test -p stutter --lib startup_recovery

      - name: Prepared rollback contracts
        run: cargo test -p stutter --lib prepared

      - name: Runtime failed-apply reporting contracts
        run: cargo test -p stutter --lib fault_reporting

      - name: Fake daemon simulation
        run: cargo test -p stutter autotune::simulation

      - name: Fault-injection action runner tests
        run: cargo test -p stutter actions::runner::tests

      - name: Policy rejection tests
        run: cargo test -p stutter daemon::policy::tests

      - name: Watchdog, soak, service, and release gates
        run: |
          cargo test -p stutter watchdog
          cargo test -p stutter soak
          cargo test -p stutter service
          cargo test -p stutter release
          cargo test -p stutter acceptance

      - name: Architecture boundary tests
        run: cargo test -p stutter architecture_tests

  schema-snapshots:
    name: schema and fixture gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust nightly with rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-06
          components: rust-src

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install bpf-linker
        uses: ./.github/actions/setup-bpf-linker

      - name: Artifact contract tests
        run: cargo test -p stutter artifact_contract_tests

      - name: Validation corpus tests
        run: cargo test -p stutter validation_corpus
