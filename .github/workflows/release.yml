name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly-2026-06-06

jobs:
  linux-x86_64:
    name: linux x86_64 release build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust nightly with rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-06
          components: rust-src

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install bpf-linker
        uses: ./.github/actions/setup-bpf-linker

      - name: Build release binary
        run: cargo build -p stutter --release

      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="stutter") | .version')
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match crate version v${VERSION}"
            exit 1
          fi

      - name: Locate eBPF object (required)
        id: ebpf-object
        run: |
          # The object is built into OUT_DIR and embedded in the binary. The supported
          # package layout (packaging/tarball/MANIFEST.txt) also ships it at
          # lib/stutter/stutter.bpf.o, so its absence is a release failure, not a warning.
          OBJECT_PATH=$(find target/release/build -path '*/stutter-*/out/stutter' -type f | head -1)
          if [ -z "$OBJECT_PATH" ]; then
            echo "eBPF object not found in build output; refusing to release"
            exit 1
          fi
          echo "path=$OBJECT_PATH" >> "$GITHUB_OUTPUT"

      - name: Package release (layout, source archive, SBOM, manifest, SHA256SUMS)
        run: |
          cargo run -p xtask -- release-package \
            --binary target/release/stutter \
            --bpf-object "${{ steps.ebpf-object.outputs.path }}" \
            --out dist

      - name: Verify package (checksums, layout, provenance; no live acceptance)
        run: |
          # A hosted runner has no exact-commit live acceptance bundles, so this is a secondary
          # reproducible-build and packaging check. Authoritative publication is done locally:
          # release-verify --require-acceptance with the external bundles, then release-publish.
          cargo run -p xtask -- release-verify dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stutter-linux-x86_64-release
          path: |
            dist/stutter-*-linux-x86_64.tar.gz
            dist/stutter-*-source.tar.gz
            dist/SHA256SUMS
            dist/release-manifest.json
            dist/sbom.cdx.json
            dist/SUPPORT.md
