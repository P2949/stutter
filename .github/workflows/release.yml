name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly

jobs:
  linux-x86_64:
    name: linux x86_64 release build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly with rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install bpf-linker
        run: cargo install bpf-linker --locked

      - name: Build release binary
        run: cargo build -p stutter --release

      - name: Locate eBPF object
        id: ebpf-object
        run: |
          # The eBPF object is built into OUT_DIR during the normal cargo build.
          # Locate it so we can upload it as a separate release artifact.
          OBJECT_PATH=$(find target/release/build -path '*/stutter-*/out/stutter' -type f | head -1)
          if [ -z "$OBJECT_PATH" ]; then
            echo "WARNING: eBPF object not found in build output"
          else
            echo "path=$OBJECT_PATH" >> "$GITHUB_OUTPUT"
            cp "$OBJECT_PATH" stutter.bpf.o
            echo "Found eBPF object: $OBJECT_PATH"
          fi

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/release/stutter dist/stutter
          cp README.md dist/
          cp docs/INSTALL.md dist/
          cp docs/SAFETY.md dist/
          tar -C dist -czf stutter-linux-x86_64.tar.gz .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: stutter-linux-x86_64
          path: stutter-linux-x86_64.tar.gz

      - name: Upload eBPF object artifact
        if: steps.ebpf-object.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: stutter-bpf-object
          path: stutter.bpf.o
