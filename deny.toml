[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Prototype policy: keep duplicate transitive versions visible without failing
# the build. CI still denies advisories, unknown registries, unknown git sources,
# and non-allowlisted licenses.
multiple-versions = "allow"

# Workspace dependency versions are reviewed in Cargo.toml/Cargo.lock. Wildcards
# are allowed here to avoid turning this advisory hygiene check into a packaging
# policy gate while the prototype is still changing quickly.
wildcards = "allow"

highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/aya-rs/aya"]

[[licenses.exceptions]]
name = "inferno"
allow = ["CDDL-1.0"]

[[licenses.clarify]]
name = "stutter-ebpf"
expression = "MIT OR GPL-2.0-only"
license-files = []
