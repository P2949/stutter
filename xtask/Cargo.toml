[package]
name = "xtask"
version = "0.2.0"
edition.workspace = true
description = "Repository maintenance and validation tasks for stutter."
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true, default-features = true }
cargo_metadata = { workspace = true }
clap = { workspace = true, features = ["help"] }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
stutter = { path = "../stutter" }
stutter-core = { path = "../stutter-core" }
stutter-validation-runner = { path = "../stutter-validation-runner" }
toml = { workspace = true }
