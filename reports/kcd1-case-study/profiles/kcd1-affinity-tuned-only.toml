# KCD1 case-study tuned profile.
#
# CPU topology:
#   core 0: CPUs 0,6
#   core 1: CPUs 1,7
#   core 2: CPUs 2,8
#   core 3: CPUs 3,9
#   core 4: CPUs 4,10
#   core 5: CPUs 5,11
#
# Hypothesis:
#   Keep Gamescope / runtime presentation work on core 0,
#   and keep the KCD/Wine/game process on the remaining cores.
#
# This is a reversible local process-tree CPU-affinity experiment,
# not a persistent system-wide change.

[[profile]]
name = "kcd1-game-on-1-5-7-11-gamescope-on-0-6"

# The KCD game process appears as process_comm = "Main".
# Because stutter matches both task comm and process comm, this rule catches
# the KCD process threads: Main, RenderThread, dxvk, Streaming, Physics, Audio, etc.
[[profile.rules]]
affinity = "1-5,7-11"
match_comm = ["Main"]

# Put Wine/game-class processes on the game cores too.
[[profile.rules]]
affinity = "1-5,7-11"
match_class = ["Game", "GameHelper", "WineServer"]

# Keep Gamescope and Steam runtime wrapper work away from the main game cores.
[[profile.rules]]
affinity = "0,6"
match_class = ["GameScope", "Compositor", "Launcher", "SteamRuntime"]
