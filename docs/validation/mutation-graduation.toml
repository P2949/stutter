# Mutation graduation campaigns: the parameters of `xtask mutation-campaign`. One section per
# operation; the generic stage order is fixed in code. Editing this file changes its digest and
# therefore invalidates every source-bound result of a running campaign.
schema_version = 1
name = "mutation-graduation"

[retry]
# Attempts per stage before a retryable failure becomes a failure.
default_attempts = 2

[benefit]
# Matched counterbalanced AB/BA pairs: take the initial number, then top up by `step` to `max_pairs`
# only while the result is underpowered or noisy.
initial_pairs = 15
max_pairs = 30
step = 5
# Stable persisted split of the scenarios' pairs: `calibration` parts to one `holdout` part.
calibration_parts = 2
holdout_parts = 1
window_seconds = 20
# The share of beneficial pairs the frozen thresholds must keep on the holdout. Neutral and
# regression pairs must never be kept.
min_beneficial_keep_rate = 0.8

[operation.cpu_affinity_profile]
operation = "cpu_affinity_profile"
objective = "game_runnable_latency"
capability = "cpu_affinity_experiment"
workload = "game"
pressure = "scheduler"
effect_scope = "local_process_tree"
# The stages this operation runs, in the generic order. Skipping a required stage needs an
# explicit `skip` entry with a reason.
stages = [
  "preflight",
  "mechanical",
  "fault_matrix",
  "suspend_resume",
  "benefit_calibration",
  "benefit_holdout",
  "evidence_integrate",
  "tier_decision",
]
# Affinity changes no kernel-visible resource that differs across kernels: the kernel matrix is
# not required for this operation.
skip = [
  { stage = "kernel_matrix", reason = "per-process CPU affinity has no kernel-specific interface; the core kernel matrix already covers the recorder on every supported kernel" },
]

[operation.cpu_affinity_profile.suites]
mechanical = "affinity"
fault_matrix = "recovery"
suspend_resume = "suspend-resume"

[operation.cpu_affinity_profile.scenarios]
# Beneficial: contention on the baseline placement; neutral: no contention; regression: a
# placement that makes the target measurably worse.
beneficial = "affinity-contended"
neutral = "affinity-quiet"
regression = "affinity-colocated"

[operation.cpu_affinity_profile.thresholds]
# A conservative grid around the product defaults (12.5 % / 7.5 % / 1000 samples). The runnable
# p99 is a histogram bucket bound, so one bucket step is already about 25 %: the grid extends
# upward so a stricter criterion can be chosen if neutral pairs move by a bucket.
min_improvement_percent = [10.0, 12.5, 15.0, 20.0, 25.0, 30.0, 40.0]
max_regression_percent = [5.0, 7.5, 10.0, 15.0]
min_samples = [1000]

[operation.uclamp]
operation = "uclamp"
objective = "game_runnable_latency"
capability = "uclamp_experiment"
workload = "game"
pressure = "scheduler"
effect_scope = "local_process_tree"
# The fault matrix, mechanical lifecycle and benefit pair drive the uclamp mutation.
mutation = "uclamp"
# `uclamp.min` is raised on the game's own tasks. The user owning the disposable target may do that
# unprivileged on this kernel, so the privileged-service path runs in-process.
privileged_worker = false
stages = [
  "preflight",
  "mechanical",
  "fault_matrix",
  "suspend_resume",
  "benefit_calibration",
  "benefit_holdout",
  "evidence_integrate",
  "tier_decision",
]
skip = [
  { stage = "kernel_matrix", reason = "per-task utilisation clamps are a core scheduler interface present on every supported kernel; the core kernel matrix already covers the recorder on each of them" },
]

[operation.uclamp.suites]
mechanical = "affinity"
fault_matrix = "recovery"
suspend_resume = "suspend-resume"

[operation.uclamp.scenarios]
# Uclamp has no placement to improve or worsen, so the three scenarios differ only in the
# contention the game runs under; the frozen hypothesis is that a raised `uclamp.min` shortens the
# game's runnable wait under scheduler pressure. Pre-registered: beneficial is the strongest case
# (heavy burst contention on the game's CPU), neutral and regression repeat the quiet and the
# colocated cases so a clamp that only adds noise is caught as a false keep.
beneficial = "affinity-contended"
neutral = "affinity-quiet"
regression = "affinity-colocated"

[operation.uclamp.thresholds]
min_improvement_percent = [10.0, 12.5, 15.0, 20.0, 25.0, 30.0, 40.0]
max_regression_percent = [5.0, 7.5, 10.0, 15.0]
min_samples = [1000]

[operation.nice]
operation = "nice"
objective = "game_runnable_latency"
capability = "nice_experiment"
workload = "game"
pressure = "scheduler"
effect_scope = "local_process_tree"
# The fault matrix, mechanical lifecycle and benefit pair drive the nice mutation.
mutation = "nice"
# Raising the niceness of the user's own processes needs no privilege, so the privileged-service
# path runs inside the throwaway controller.
privileged_worker = false
stages = [
  "preflight",
  "mechanical",
  "fault_matrix",
  "suspend_resume",
  "benefit_calibration",
  "benefit_holdout",
  "evidence_integrate",
  "tier_decision",
]
skip = [
  { stage = "kernel_matrix", reason = "setpriority is a core scheduler interface present on every supported kernel; the core kernel matrix already covers the recorder on each of them" },
]

[operation.nice.suites]
mechanical = "affinity"
fault_matrix = "recovery"
suspend_resume = "suspend-resume"

[operation.nice.scenarios]
# Pre-registered hypothesis: demoting the sustained background CPU hogs that share the game's CPU
# shortens the game's runnable wait. Beneficial: three ordinary hogs on the game's CPU. Neutral:
# the same hogs on another CPU, where they are still visible offenders but cannot contend with the
# game. Regression: contention no priority change can touch (a SCHED_FIFO burst on the game's CPU,
# hogs elsewhere), so any keep there is a false keep.
beneficial = "affinity-contended"
neutral = "affinity-quiet"
regression = "affinity-colocated"

[operation.nice.thresholds]
min_improvement_percent = [10.0, 12.5, 15.0, 20.0, 25.0, 30.0, 40.0]
max_regression_percent = [5.0, 7.5, 10.0, 15.0]
min_samples = [1000]

[operation.cgroup_placement]
operation = "cgroup_placement"
objective = "game_runnable_latency"
capability = "cgroup_placement_experiment"
workload = "game"
pressure = "scheduler"
effect_scope = "cgroup"
# The fault matrix, mechanical lifecycle and benefit pair drive the cgroup mutation. The runner
# delegates a cgroup subtree (cpu and cpuset controllers) to the campaign user and runs these
# suites inside it, so the suite may create the administrator's game cgroup and move its own
# disposable tasks without any privileged process of its own.
mutation = "cgroup"
privileged_worker = false
stages = [
  "preflight",
  "mechanical",
  "fault_matrix",
  "suspend_resume",
  "benefit_calibration",
  "benefit_holdout",
  "evidence_integrate",
  "tier_decision",
]
skip = [
  { stage = "kernel_matrix", reason = "cgroup v2 task migration and cpuset are core kernel interfaces present on every supported kernel; the core kernel matrix already covers the recorder on each of them" },
]

[operation.cgroup_placement.suites]
mechanical = "affinity"
fault_matrix = "recovery"
suspend_resume = "suspend-resume"

[operation.cgroup_placement.scenarios]
# Pre-registered hypothesis: placing the game into the administrator-configured game cgroup, whose
# cpuset is a CPU free of contention, shortens the game's runnable wait. The scenarios are the
# affinity ones: contention on the game's CPU, equal contention on both, and heavier contention on
# the game cgroup's CPU (placement hurts).
beneficial = "affinity-contended"
neutral = "affinity-quiet"
regression = "affinity-colocated"

[operation.cgroup_placement.thresholds]
min_improvement_percent = [10.0, 12.5, 15.0, 20.0, 25.0, 30.0, 40.0]
max_regression_percent = [5.0, 7.5, 10.0, 15.0]
min_samples = [1000]
