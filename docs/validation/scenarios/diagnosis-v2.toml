# Post-v0.1 diagnosis evidence study (study schema 1). Ground truth is the predeclared
# intervention, never Stutter's diagnosis output. Each family is a matched pair: the same
# target and configuration with and without the intervention, captured in counterbalanced
# AB/BA order. A family's captures may enter calibration only after an independent
# target-impact test (direct metric, bootstrap CI excluding zero in the worsening direction
# and a non-trivial effect size) passes; a family that cannot show impact at the cap is
# closed as invalid for calibration and its thresholds are never touched.
study_schema_version = 1
study = "diagnosis-v2"

[vkmark]
light_scene = "cube"
light_size = "640x480"
heavy_scene = "texture"
heavy_size = "3840x2160"
present_mode = "fifo"
heavy_present_mode = "immediate"

[sampling]
initial_pairs = 15
max_pairs = 30
extension_step = 5
min_effect_size = 0.5
failed_attempts_per_capture = 3
seconds = 30
background_wakeup_coalescing = 16
background_block_collisions = 16

# The v0.1-style single 4 kpps sender had no measurable effect on the target (the IRQ family
# closed as invalid at the cap). The study's design is a stronger sender: several flows, each
# verified to drive the frozen interrupt, paced precisely and confined to CPUs that share no
# core with the target or the interrupt, so the load reaches the target only through the IRQ.
[irq_traffic]
threads = 4
pps_per_thread = 25000
payload = 18

[[family]]
family = "scheduler"
target = "vkmark_light"
intervention = "scheduler_burst"
placement = "study_cpu"
metric = "runnable_p99_ns"

[[family]]
family = "io"
target = "fio_fixed_work_v2"
intervention = "blocking_io"
metric = "target_elapsed_ms"
accepted_block_collisions = 100000

[[family]]
family = "irq"
# Unpaced: a vsync-paced scene has idle time to absorb interrupts (the first designs, a 640x480
# vsynced cube under 4 kpps and then ~1M interrupts per capture, left its frame time unchanged
# at 7.8 ms), so its frame time would not reveal them. Unpaced, frame time is CPU time.
target = "vkmark_light_unpaced"
intervention = "network_traffic"
placement = "irq_cpu"
metric = "frame_p99_ms"

[[family]]
family = "gpu"
target = "vkmark_gpu_heavy"
intervention = "gpu_stressor"
metric = "frame_p99_ms"
# Two stressors: a single one did not keep the GPU above the 90% verification bar while the
# desktop was also in use.
gpu_stressors = 2
# Two saturating stressors make driver threads wake in bursts (369-423 coalesced records
# measured per capture).
accepted_wakeup_coalescing = 1024

[[mixed]]
id = "mixed-scheduler-io"
covers = ["scheduler", "io"]
target = "fio_fixed_work_v2"
interventions = ["scheduler_burst", "blocking_io"]
placement = "study_cpu"
expected_primary_cause = "BlockIoCandidate"
count = 6
accepted_block_collisions = 100000

[[mixed]]
id = "mixed-irq-gpu"
covers = ["irq", "gpu"]
target = "vkmark_gpu_heavy"
interventions = ["network_traffic", "gpu_stressor"]
placement = "irq_cpu"
expected_primary_cause = "GpuBoundCandidate"
count = 6
accepted_wakeup_coalescing = 1024
