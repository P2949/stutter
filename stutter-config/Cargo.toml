[package]
name = "stutter-config"
version = "0.1.0"
edition.workspace = true
description = "Configuration parsing and CLI merge support for stutter."
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
stutter-core = { path = "../stutter-core" }
clap = { workspace = true, optional = true }
serde = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
cli = ["dep:clap"]

[lib]
path = "src/lib.rs"
