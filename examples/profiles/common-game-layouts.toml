# Example stutter profile set.
# Edit CPU masks for the target machine.
# These examples are experiments, not guaranteed improvements.
#
# Example masks after checking your topology:
#
# 4C/8T:
#   compositor/helper: "0-1"
#   game/main:         "2-7"
#
# 6C/12T:
#   compositor/helper: "0-1"
#   game/main:         "2-11"
#
# 8C/16T:
#   compositor/helper: "0-3"
#   game/main:         "4-15"
#
# Hybrid CPU:
#   prefer explicit masks only after checking /sys/devices/system/cpu/cpu*/topology
#   keep compositor/helper on stable low-load CPUs
#   do not blindly copy masks across machines

[[profile]]
name = "baseline-online"

[[profile.rules]]
affinity = "online"
match_class = ["Game", "GameHelper", "WineServer", "GameScope", "Compositor", "Launcher", "SteamRuntime", "Helper", "Unknown"]

[[profile]]
name = "game-on-middle-compositor-low"

[[profile.rules]]
# Replace "online" with a low-core mask such as "0-1" after checking your CPU layout.
affinity = "online"
match_class = ["GameScope", "Compositor"]

[[profile.rules]]
# Replace "online" with a game-core mask such as "2-5" after checking your CPU layout.
affinity = "online"
match_class = ["Game", "GameHelper", "WineServer"]

[[profile]]
name = "game-render-isolated"

[[profile.rules]]
# Profile rules are first-match-wins. Put specific rules before broad fallback rules.
# Replace "online" with a render-thread mask such as "2-5" after checking your CPU layout.
affinity = "online"
match_comm = ["RenderThread", "Main"]

[[profile.rules]]
# Broad Game fallback catching any game threads not matched above.
affinity = "online"
match_class = ["Game", "GameHelper", "WineServer"]

[[profile.rules]]
# Replace "online" with a compositor/helper mask such as "0-1" after checking your CPU layout.
affinity = "online"
match_class = ["GameScope", "Compositor", "Launcher", "SteamRuntime"]
