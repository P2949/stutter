[package]
name = "stutter-validation-runner"
version = "0.1.0"
edition.workspace = true
description = "Validation-only privileged runner for the Stutter Core Validation campaign (not a product component)."
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "stutter-validation-runner"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true, default-features = true }
clap = { workspace = true, features = ["help"] }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
stutter-core = { path = "../stutter-core" }
